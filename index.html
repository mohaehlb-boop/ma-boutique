<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ma Boutique</title>
  <meta name="description" content="Bienvenue dans ma boutique : produits, conseils, offres." />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Theme change (mode sombre/clair) -->
  <script src="https://unpkg.com/@theme-change/core@latest/index.js"></script>
</head>

<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-white min-h-screen flex flex-col">
  <!-- Bouton mode sombre/clair -->
  <button
    data-toggle-theme="dark,light"
    data-act-class="ACTIVE"
    class="fixed top-4 right-4 p-3 bg-gray-200 dark:bg-gray-800 rounded-full shadow"
    aria-label="Changer de thème"
  >☀️/🌙</button>

  <!-- Header -->
  <header class="text-center py-12">
    <h1 class="text-4xl font-bold">Ma Boutique</h1>
    <p class="mt-2 text-gray-600 dark:text-gray-300">Des produits sympas, au meilleur prix</p>
  </header>

  <!-- Contenu principal -->
  <main class="max-w-3xl mx-auto p-5 flex-grow">
    <!-- Section produits (exemples) -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="border rounded-lg p-5 dark:border-gray-700">
        <h2 class="text-xl font-bold">Produit 1</h2>
        <p class="mt-2">Description courte. Prix : 19€</p>
        <a href="#" class="mt-4 inline-block bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Acheter</a>
      </div>
      <div class="border rounded-lg p-5 dark:border-gray-700">
        <h2 class="text-xl font-bold">Produit 2</h2>
        <p class="mt-2">Description courte. Prix : 29€</p>
        <a href="#" class="mt-4 inline-block bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Acheter</a>
      </div>
    </section>

    <!-- Dons -->
    <div class="my-10 text-center">
      <a
        href="https://buymeacoffee.com/tonnom"
        target="_blank"
        class="inline-block bg-yellow-500 text-white px-6 py-3 rounded-lg font-bold hover:bg-yellow-600"
      >
        Soutenez-moi ☕
      </a>
    </div>

    <!-- Formulaire de contact -->
    <section class="mt-10">
      <h2 class="text-2xl font-bold mb-4">Contact</h2>
      <form action="https://formspree.io/f/tonform" method="POST" class="space-y-4">
        <input type="text" name="name" placeholder="Nom" class="w-full p-3 border rounded dark:bg-gray-800 dark:border-gray-700" required />
        <input type="email" name="email" placeholder="Email" class="w-full p-3 border rounded dark:bg-gray-800 dark:border-gray-700" required />
        <textarea name="message" placeholder="Message" class="w-full p-3 border rounded h-32 dark:bg-gray-800 dark:border-gray-700" required></textarea>
        <button type="submit" class="w-full bg-blue-500 text-white py-3 rounded font-bold hover:bg-blue-600">Envoyer</button>
      </form>
    </section>
  </main>

  <!-- Footer + affiliation -->
  <footer class="text-center py-6 bg-gray-100 dark:bg-gray-800">
    <p>Recommandations : <a href="https://amazon.fr" target="_blank" class="underline">Amazon</a></p>
    <p class="text-sm mt-2 text-gray-500">© Ma Boutique</p>
  </footer>

  <script>themeChange(false)</script>
</body>
</html>
